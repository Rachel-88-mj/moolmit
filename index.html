<style>
:root{
  --ink:#dcf1f2;
  --ink-dim:#93bcc1;
  --glow:#a6f4e4;
  --deep:#03202b;
  --veil:rgba(3,32,43,.42);
  --line:rgba(166,244,228,.45);
  --chip:rgba(3,32,43,.6);
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#dcf1f2; --ink-dim:#93bcc1; --glow:#a6f4e4; --deep:#03202b; --veil:rgba(3,32,43,.42); --line:rgba(166,244,228,.45); --chip:rgba(3,32,43,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#dcf1f2; --ink-dim:#93bcc1; --glow:#a6f4e4; --deep:#03202b; --veil:rgba(3,32,43,.42); --line:rgba(166,244,228,.45); --chip:rgba(3,32,43,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--deep);color:var(--ink);
  font-family:"Gowun Batang","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  -webkit-font-smoothing:antialiased}
canvas#sea{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#sea:active{cursor:grabbing}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--glow);outline-offset:4px;border-radius:999px}
.flag{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;line-height:1}

/* gate */
.gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;background:var(--veil);transition:opacity 2.4s ease, visibility 0s linear 2.4s;z-index:5;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
.gate.gone{opacity:0;visibility:hidden}
.gate h1{margin:0;font-weight:400;font-size:clamp(72px,16vw,148px);letter-spacing:.14em;line-height:1;
  padding-left:.14em;text-shadow:0 0 40px rgba(166,244,228,.25)}
.gate .line{margin:28px 0 30px;font-size:clamp(16px,2.2vw,19px);color:var(--ink);line-height:1.8}
.gate .enter{border:1px solid var(--line);border-radius:999px;padding:13px 34px;font-size:16px;letter-spacing:.08em;
  transition:background .4s ease}
.gate .enter:hover{background:rgba(166,244,228,.1)}
.gate .note{margin-top:22px;font-size:13px;color:#bcdde2}

/* diver tags */
.tags{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:999px;
  background:var(--chip);border:1px solid var(--line);font-size:13px;white-space:nowrap;color:var(--ink);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);will-change:transform}
.tag .flag{font-size:17px}
.tag .dd{color:var(--ink-dim);font-variant-numeric:tabular-nums}
.tag .arrow{display:none;width:0;height:0;border-left:7px solid var(--glow);border-top:5px solid transparent;border-bottom:5px solid transparent}
.tag.edge .arrow{display:inline-block}
.tag.edge{background:rgba(3,32,43,.72)}

/* hud */
.hud{text-shadow:0 1px 14px rgba(3,32,43,.75),0 0 2px rgba(3,32,43,.5);position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none;opacity:0;transition:opacity 3s ease 1.2s;z-index:3;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 22px calc(env(safe-area-inset-bottom,0px) + 20px)}
.hud.on{opacity:1}
.hud button{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.mark{font-size:20px;letter-spacing:.14em}
.toggles{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:18px;font-size:13px;color:var(--ink)}
.toggles button{padding:4px 2px}
.mid{flex:1;position:relative;display:flex;align-items:center;justify-content:flex-end}
.depthctl{display:flex;flex-direction:column;gap:10px}
.depthctl button{border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:13px;color:var(--ink);
  background:rgba(3,32,43,.25);user-select:none;-webkit-user-select:none;touch-action:none}
.depthctl button:active{background:rgba(166,244,228,.14)}
.breath{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font-size:15px;letter-spacing:.3em;
  color:var(--ink);opacity:0;transition:opacity 1.2s ease;white-space:nowrap;padding-left:.3em}
.hint{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-size:14px;color:var(--ink);
  text-align:center;opacity:0;transition:opacity 1.6s ease;max-width:90%}
.hint.on{opacity:.9}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.depth{font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.depth .unit{font-size:18px;margin-left:6px;color:var(--ink-dim)}
.time,.me{margin-top:8px;font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.habitat{margin-top:12px;font-size:12px;line-height:1.8;color:var(--ink-dim);max-width:min(64vw,360px)}
.habitat button{display:block;padding:3px 0;color:var(--ink-dim);font-size:12px;text-align:left}
.me{display:flex;align-items:center;gap:6px;margin-top:6px}
.me .flag{font-size:15px}
.together{font-size:14px;color:var(--ink);text-align:right;display:flex;align-items:center;gap:10px}
.together .dot{width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px var(--glow)}
.together{flex-wrap:wrap;justify-content:flex-end}
.together .dot{flex-shrink:0}
#realtimeRetry,#gateRealtimeRetry{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px}
#realtimeRetry[hidden],#gateRealtimeRetry[hidden]{display:none}
.gate .live{margin:0 0 20px;font-size:14px;letter-spacing:.04em;color:var(--glow)}
.gate .stats{margin-top:10px}
.tag.near{border-color:var(--glow);background:rgba(166,244,228,.16)}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%) translateY(-10px);
  background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:13px;color:var(--ink);
  opacity:0;transition:opacity .5s ease,transform .5s ease;pointer-events:none;z-index:6;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:520px){
  .depth{font-size:36px}
  .together{font-size:13px;max-width:52vw}
  .toggles{gap:12px}
}
@media (prefers-reduced-motion: reduce){
  .gate,.hud,.breath,.hint{transition-duration:.01s}
}
.invite{width:min(600px,calc(100vw - 32px));max-height:90dvh;overflow:auto;padding:24px;border:1px solid var(--line);border-radius:20px;background:#062631;color:var(--ink)}
.invite::backdrop{background:rgba(0,12,18,.78)}
.invite h2{font-size:24px;font-weight:400;margin:0 0 8px}.invite p{font-size:13px;line-height:1.8;color:var(--ink-dim)}
.invite .invite-close{float:right;padding:6px 10px}.invite img{display:block;width:100%;height:auto;max-height:38dvh;object-fit:contain;border-radius:10px;margin:18px 0}
.invite label{display:block;font-size:13px;margin:12px 0 8px}.invite input{width:100%;padding:12px;color:var(--ink);background:#03202b;border:1px solid var(--line);border-radius:8px;font:14px monospace}
.invite-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.invite-actions button{padding:11px 16px;border:1px solid var(--line);border-radius:999px;font-size:14px}.invite-actions button:first-child{background:#a6f4e4;color:#03202b}.invite button:disabled{opacity:.45;cursor:wait}
.invite .invite-status{min-height:24px;color:var(--glow);margin-bottom:0}
@media(max-width:520px){.invite{padding:18px}.toggles{gap:6px 12px;max-width:78%}.toast{white-space:normal;max-width:90vw;text-align:center}}
@media(pointer:coarse),(max-width:900px){
 .depthctl{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom,0px) + 142px);gap:12px}.depthctl button{min-height:48px;min-width:84px;background:rgba(3,32,43,.68)}
 .breath{bottom:2%;font-size:13px}.hint{top:8%;width:88%;font-size:12px;line-height:1.9}.hud{padding-left:16px;padding-right:16px}
}
@media(max-height:520px) and (orientation:landscape){.depthctl{bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}.depth{font-size:28px}.time,.me{font-size:11px}.hint{top:0%;max-width:46%}}
</style>
</head>
<body>
<canvas id="sea" aria-label="바닷속 3D 공간. 끌어서 주위를 둘러볼 수 있어요."></canvas>
<div class="tags" id="tags" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="hud" id="hud">
  <div class="top">
    <span class="mark">물밑</span>
    <div class="toggles">
      <button id="soundBtn" type="button">소리 끄기</button>
      <button id="guideBtn" type="button">호흡 안내 끄기</button>
      <button id="shotBtn" type="button">이 장소로 초대하기</button>
    </div>
  </div>
  <div class="mid">
    <div class="hint" id="hint">방향키로 헤엄치고, Q·E로 깊이를 조절해요<br>G는 인사, 마우스를 끌면 고개를 돌릴 수 있어요</div>
    <div class="breath" id="breath" aria-hidden="true"></div>
    <div class="depthctl">
      <button id="upBtn" type="button" aria-label="위로 올라가기">올라가기</button>
      <button id="downBtn" type="button" aria-label="더 깊이 내려가기">내려가기</button>
      <button id="waveBtn" type="button">인사하기</button>
    </div>
  </div>
  <div class="bottom">
    <div class="computer" aria-live="off">
      <div class="depth"><span id="dval">0.0</span><span class="unit">m</span></div>
      <div class="time">다이브 타임 <span id="tval">00:00</span></div>
      <div class="me">내 수트 표시 <span class="flag" id="meFlag"></span><span id="meCC"></span></div>
      <div class="habitat"><span id="habitatName">화산섬의 물밑</span><button id="routeBtn" type="button" aria-pressed="false">물길 힌트 켜기</button><span id="routeHint" hidden></span></div>
    </div>
    <div class="together"><span class="dot" aria-hidden="true"></span><span id="together" role="status">바닷속 연결을 확인하고 있어요</span><button id="realtimeRetry" type="button" hidden aria-label="바닷속 실시간 연결 다시 시도">다시 연결</button></div>
  </div>
</div>

<div class="gate" id="gate">
  <h1>물밑</h1>
  <p class="line">숨소리만 남는 곳,<br>함께 잠기는 바다.</p>
  <p class="live" id="gateLive">바닷속 다이버를 확인하는 중이에요</p>
  <button id="gateRealtimeRetry" type="button" hidden aria-label="입장 화면에서 바닷속 실시간 연결 다시 시도">다시 연결</button>
  <button class="enter" id="enterBtn" type="button">입수하기</button>
  <p class="note">소리를 켜고 들어오면 더 좋아요</p>
  <p class="note stats" id="gateStats"></p>
</div>

<dialog class="invite" id="inviteDialog" aria-labelledby="inviteTitle">
  <button class="invite-close" id="inviteClose" type="button" aria-label="초대 창 닫기">닫기</button>
  <h2 id="inviteTitle">이 장소로 초대하기</h2>
  <p>지금의 수심과 좌표, 바라보던 방향을 담았어요.<br>초대 링크를 열고 입수하면 이 자리에서 시작해요.</p>
  <img id="invitePreview" alt="수심과 좌표가 새겨진 물밑 초대 이미지">
  <label for="inviteLink">이 장소로 오는 초대 링크</label>
  <input id="inviteLink" readonly spellcheck="false" aria-describedby="inviteStatus">
  <div class="invite-actions">
    <button id="inviteShare" type="button">초대 공유하기</button>
    <button id="inviteCopy" type="button">링크 복사</button>
    <button id="inviteSave" type="button">이미지 저장</button>
  </div>
  <p class="invite-status" id="inviteStatus" role="status" aria-live="polite"></p>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

/* ---------- country (from device time zone / locale) ---------- */
const TZ = {
  'Asia/Seoul':'KR','Asia/Tokyo':'JP','Asia/Taipei':'TW','Asia/Hong_Kong':'HK','Asia/Macau':'MO','Asia/Shanghai':'CN',
  'Asia/Chongqing':'CN','Asia/Harbin':'CN','Asia/Urumqi':'CN','Asia/Singapore':'SG','Asia/Kuala_Lumpur':'MY','Asia/Kuching':'MY',
  'Asia/Bangkok':'TH','Asia/Ho_Chi_Minh':'VN','Asia/Saigon':'VN','Asia/Manila':'PH','Asia/Jakarta':'ID','Asia/Makassar':'ID',
  'Asia/Jayapura':'ID','Asia/Kolkata':'IN','Asia/Calcutta':'IN','Asia/Dubai':'AE','Asia/Riyadh':'SA','Asia/Qatar':'QA',
  'Asia/Jerusalem':'IL','Asia/Kathmandu':'NP','Asia/Colombo':'LK','Asia/Karachi':'PK','Asia/Dhaka':'BD','Asia/Yangon':'MM',
  'Asia/Phnom_Penh':'KH','Asia/Vientiane':'LA','Asia/Ulaanbaatar':'MN','Asia/Brunei':'BN','Indian/Maldives':'MV',
  'Pacific/Auckland':'NZ','Pacific/Honolulu':'US','Pacific/Guam':'GU','Pacific/Saipan':'MP','Pacific/Palau':'PW','Pacific/Fiji':'FJ',
  'Europe/London':'GB','Europe/Dublin':'IE','Europe/Paris':'FR','Europe/Berlin':'DE','Europe/Madrid':'ES','Europe/Rome':'IT',
  'Europe/Amsterdam':'NL','Europe/Brussels':'BE','Europe/Zurich':'CH','Europe/Vienna':'AT','Europe/Stockholm':'SE','Europe/Oslo':'NO',
  'Europe/Copenhagen':'DK','Europe/Helsinki':'FI','Europe/Lisbon':'PT','Europe/Warsaw':'PL','Europe/Prague':'CZ','Europe/Budapest':'HU',
  'Europe/Athens':'GR','Europe/Istanbul':'TR','Europe/Moscow':'RU','Europe/Kiev':'UA','Europe/Kyiv':'UA','Europe/Bucharest':'RO',
  'America/Toronto':'CA','America/Vancouver':'CA','America/Edmonton':'CA','America/Winnipeg':'CA','America/Halifax':'CA','America/Montreal':'CA',
  'America/Mexico_City':'MX','America/Cancun':'MX','America/Sao_Paulo':'BR','America/Argentina/Buenos_Aires':'AR','America/Buenos_Aires':'AR',
  'America/Santiago':'CL','America/Lima':'PE','America/Bogota':'CO','America/Caracas':'VE','America/Panama':'PA','America/Costa_Rica':'CR',
  'Africa/Cairo':'EG','Africa/Johannesburg':'ZA','Africa/Nairobi':'KE','Africa/Lagos':'NG','Africa/Casablanca':'MA'
};
function detectCC(){
  let tz = '';
  try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){}
  if(TZ[tz]) return TZ[tz];
  if(/^Australia\//.test(tz)) return 'AU';
  if(/^America\/(New_York|Chicago|Denver|Los_Angeles|Phoenix|Anchorage|Detroit|Boise|Indiana|Kentucky|North_Dakota|Juneau|Adak)/.test(tz)) return 'US';
  const langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
  for(const l of langs){ const m = /[-_]([A-Za-z]{2})$/.exec(l); if(m) return m[1].toUpperCase(); }
  return '';
}
let myCC = detectCC();
function flagEmoji(cc){
  return /^[A-Z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : '🌊';
}
$('meFlag').textContent = flagEmoji(myCC);
$('meCC').textContent = myCC || '알 수 없음';
/* country from IP (Vercel edge header via /api/country); time zone guess stays as fallback */
fetch('/api/country', {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(j => {
  if(j && typeof j.cc === 'string' && /^[A-Z]{2}$/.test(j.cc)){
    myCC = j.cc;
    $('meFlag').textContent = flagEmoji(myCC);
    $('meCC').textContent = myCC;
    if(typeof retrackSelf === 'function') retrackSelf();
  }
}).catch(()=>{});

/* ---------- renderer / scene ---------- */
const canvas = $('sea');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(innerWidth, innerHeight, false);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(new THREE.Color('#2b8fa3'), 0.022);
scene.background = scene.fog.color;

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 320);
const FLOOR_Y = -42, MAX_DEPTH = 39, MIN_DEPTH = 0.8;

const hemi = new THREE.HemisphereLight(0x9fe0e8, 0x02121a, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xdff8ff, 0.8);
sun.position.set(10, 50, 6);
scene.add(sun);

/* underwater environment light for reflective skin (silver fish, mask glass, tanks) */
const envCube = (function(){
  const S = 128;
  const face = kind => {
    const c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d');
    if(kind === 'top'){
      const gr = g.createRadialGradient(S/2,S/2,0,S/2,S/2,S*0.75);
      gr.addColorStop(0,'#ffffff'); gr.addColorStop(0.25,'#d6f6fb'); gr.addColorStop(1,'#5fb4c4');
      g.fillStyle = gr;
    } else if(kind === 'bottom'){
      g.fillStyle = '#04141a';
    } else {
      const gr = g.createLinearGradient(0,0,0,S);
      gr.addColorStop(0,'#7cc8d4'); gr.addColorStop(0.45,'#1f6c7d'); gr.addColorStop(1,'#04161c');
      g.fillStyle = gr;
    }
    g.fillRect(0,0,S,S);
    return c;
  };
  const tex = new THREE.CubeTexture([face('side'),face('side'),face('top'),face('bottom'),face('side'),face('side')]);
  tex.needsUpdate = true;
  return tex;
})();
const envMats = [];
function envMat(mat, base){ mat.envMap = envCube; mat.userData.envBase = base; mat.envMapIntensity = base; envMats.push(mat); return mat; }

const C_SHALLOW = new THREE.Color('#377f80'), C_MID = new THREE.Color('#15575e'), C_DEEP = new THREE.Color('#062c3b');
function waterColor(d, out){
  if(d < 15) out.copy(C_SHALLOW).lerp(C_MID, d/15);
  else out.copy(C_MID).lerp(C_DEEP, Math.min(1, (d-15)/25));
}

const timeU = { value: 0 };
let pxScale = 1;
function updatePxScale(){
  pxScale = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
}
updatePxScale();

const CAUSTIC_GLSL = `
float causticF(vec2 uv, float time){
  vec2 p = mod(uv*6.28318, 6.28318) - 250.0;
  vec2 i = p; float c = 1.0; float inten = 0.005;
  for(int n=0;n<4;n++){
    float t = time*(1.0 - (3.5/float(n+1)));

    -sc.depth + Math.sin(t*0.07 + k)*1.6,

function updateSchools(t, dt, camDepth){
  for(const sc of schools){

    sc.depth += Math.sign(want - sc.depth) * Math.min(Math.abs(want - sc.depth), 0.35*dt);
    const {mesh, f} = sc;
    for(let i=0;i<f.length;i++){
      const fi = f[i];
      const tt = t - fi.lag;
      schoolCenter(sc, tt, tA);
      schoolCenter(sc, tt + 0.1, tB);
      tC.copy(tB).sub(tA).multiplyScalar(10);
      tA.add(fi.o);

      fi.p.addScaledVector(fi.v, dt);

      tB.copy(fi.p).add(fi.v);

        el.style.opacity = 0.85;
        setTimeout(()=>{ if(lastPhase === phase) el.style.opacity = 0.25; }, 1800);
      }
    }
  }
  const buoy = entered ? (inhaling ? 0.22*Math.sin((ph/INHALE)*Math.PI/2) : 0.22*(1 - (ph-INHALE)/(BREATH-INHALE))) : 0;

  if(!reduceMotion && performance.now() - lastInteract > 6000) yaw += dt*0.012;
  if(entered && !drag && performance.now() - lastInteract > 2000) pitch += (0 - pitch)*Math.min(1, dt*0.25);
  const finBob = reduceMotion ? 0 : Math.sin(kickPh)*0.035*Math.min(1, swimSpeed/0.8);
  camPos.set(posX, -depth + buoy + finBob + (reduceMotion ? 0 : Math.sin(t*0.4)*0.12), posZ);
  camera.position.copy(camPos);
  fwd.set(Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch));
  look.copy(camPos).add(fwd);
  camera.lookAt(look);
  if(!reduceMotion){
    camera.rotateZ(roll + Math.sin(kickPh*0.5)*0.006*Math.min(1, swimSpeed));
    camera.rotateX(Math.sin(kickPh)*0.008*Math.min(1, swimSpeed));
  }
  camera.updateMatrixWorld();

  waterColor(depth, wcol);
  scene.fog.color.copy(wcol);
  scene.fog.density = 0.02 + 0.02*(depth/40);
  const lightK = 1 - Math.min(1, depth/40);
  hemi.intensity = 0.48 + 0.5*lightK;
  sun.intensity = 0.23 + 0.6*lightK;
  for(const m of rayMats) m.uniforms.uI.value = 0.05 + 0.08*lightK;
  for(const m of envMats) m.envMapIntensity = m.userData.envBase*(0.25 + 0.75*lightK);
  if(ambLP) ambLP.frequency.value = Math.max(240, 700 - depth*11);

  if(entered && !inhaling && ph - INHALE < 2200 && t - lastSpawnSelf > 0.05){
    lastSpawnSelf = t;
    const sx = Math.cos(yaw), sz = -Math.sin(yaw);
    for(let k=0;k<2;k++){
      const j = (Math.random()-.5)*0.5;
      spawnBubble(camPos.x + fwd.x*1.1 + sx*j, camPos.y - 0.45 + Math.random()*0.1, camPos.z + fwd.z*1.1 + sz*j);
    }
  }

  // other divers
  const now = Date.now();
  const W = innerWidth, H = innerHeight;
  for(const e of peers.values()){
    const near = e.cur.distanceTo(camPos) < 7;
    if(near !== e.near){ e.near = near; e.tag.classList.toggle('near', near); }
    const gap = e.cur.distanceTo(e.target);
    e.cur.lerp(e.target, Math.min(1, dt*1.4));
    e.moving = (e.moving || 0) + ((gap > 0.12 ? 1 : 0) - (e.moving || 0))*Math.min(1, dt*2);
    e.kph = (e.kph || 0) + dt*(1.9 + e.moving*1.8);
    const pph = ((now - e.b) % BREATH + BREATH) % BREATH;
    const pin = pph < INHALE;
    const swell = pin ? Math.sin((pph/INHALE)*Math.PI/2) : 1 - (pph-INHALE)/(BREATH-INHALE);
    const dv = e.diver;
    dv.position.copy(e.cur); dv.position.y += swell*0.2;
    const wantH = e.h !== null ? e.h : Math.atan2(-e.cur.x, -e.cur.z) + 0.7*Math.sin(t*0.035 + e.seed);
    if(e.hc === undefined) e.hc = wantH;
    e.hc += Math.atan2(Math.sin(wantH - e.hc), Math.cos(wantH - e.hc))*Math.min(1, dt*2);
    dv.rotation.set(-0.06 + 0.05*Math.sin(t*0.3 + e.seed) - swell*0.04, e.hc, 0.04*Math.sin(t*0.25 + e.seed));
    const amp = 1 + e.moving*0.5;
    for(const lg of dv.userData.legs){
      const a = e.kph + (lg.sd > 0 ? 0 : Math.PI) + e.seed;
      lg.hip.rotation.x = 0.12 + 0.2*amp*Math.sin(a);
      lg.knee.rotation.x = 0.45 + 0.22*amp*Math.sin(a - 0.9);
      lg.ankle.rotation.x = -0.35 + 0.18*Math.sin(a - 1.6);
    }
    const arm = dv.userData.arm;
    if(arm){
      if(now < (e.waveUntil || 0)){
        e.wph = (e.wph || 0) + dt*10;
        arm.rotation.z += (1.75 + 0.5*Math.sin(e.wph) - arm.rotation.z)*Math.min(1, dt*9);
      } else arm.rotation.z *= Math.max(0, 1 - dt*5);
    }
    const beamK = Math.max(0, Math.min(1, (e.d - 10)/18));
    dv.userData.beamMat.uniforms.uI.value = 0.2*beamK;
    dv.userData.lamp.material.opacity = 0.9*beamK;
    if(!pin && pph - INHALE < 2000 && t - e.lastSpawn > 0.07){
      e.lastSpawn = t;
      dv.localToWorld(vA.copy(regLocal));
      spawnBubble(vA.x + (Math.random()-.5)*0.08, vA.y, vA.z + (Math.random()-.5)*0.08);
    }
    placeTag(e, W, H);
  }

  // sea life
  updateGalapagos(t);
  if(entered)updateGalHud(t);
  updateBubbles(dt, t);
  snowMat.uniforms.uCam.value.copy(camPos);
  snowMat.uniforms.uScale.value = pxScale;
  bubbleMat.uniforms.uScale.value = pxScale;
  bioMat.uniforms.uFade.value += ((depth > 22 ? 1 : 0) - bioMat.uniforms.uFade.value)*Math.min(1, dt*0.7);
  bioMat.uniforms.uCam.value.copy(camPos);
  bioMat.uniforms.uScale.value = pxScale;

  if(entered){
    $('dval').textContent = Math.max(0, depth - buoy).toFixed(1);
    $('tval').textContent = fmt((performance.now() - enterTime)/1000);
    presenceTimer += dt;
    if(presenceTimer > 0.3){ presenceTimer = 0; sendPresence(false); }
    stats.totalMs += dt*1000;
    if(depth > stats.maxDepth) stats.maxDepth = depth;
    statsSaveT += dt;
    if(statsSaveT > 15){ statsSaveT = 0; saveStats(); }
    encTimer += dt;
    if(encTimer > 0.5){ encTimer = 0; checkEncounters(t); }
    if(whaleAt && performance.now() > whaleAt){
      if(depth > 20){ playWhale(); whaleAt = performance.now() + 90000 + Math.random()*90000; }
      else whaleAt = performance.now() + 15000;
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  updatePxScale();
}
window.addEventListener('resize', resize);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
